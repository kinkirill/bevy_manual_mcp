[package]
name = "bevy-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Version-accurate Bevy API docs, guides, examples and migration notes as an MCP server"
license = "MIT"
repository = "https://github.com/kinkirill/bevy_manual_mcp"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
memmap2 = "0.9"
rkyv = "=0.8.18"
schemars = "1"
tantivy = "=0.27.0"
rmcp = { version = "=3.8.0", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.11"
tar = "0.4"
ureq = "3"
zstd = "0.14"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
toml = "0.9"

[dev-dependencies]
sha2 = "0.11"
tempfile = "3"
