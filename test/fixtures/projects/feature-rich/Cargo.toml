# Phase 0 fixture: a workspace root.
#
# `bevy` features here are inherited by `app` via `workspace = true`. A second
# dependency (`serde`) exists purely to prove that another crate's features do
# not leak into the Bevy report.
[workspace]
members = ["app"]
resolver = "2"

[workspace.dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["bevy_ui"] }
serde = { version = "1.0", features = ["derive"] }
