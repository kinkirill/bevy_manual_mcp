name: index-release

# Build one index bundle per dispatch. Assets are published under the Bevy
# minor tag (v0.20), separately from the crate version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bevy version, e.g. 0.20.0"
        required: true
      revision:
        description: "Index revision for this Bevy version"
        required: false
        default: "1"
      publish_crate:
        description: "Also publish bevy-manual-mcp to crates.io"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERSION: ${{ inputs.version }}
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build the server
        run: cargo build --release --locked

      - name: Mirror rustdoc from docs.rs
        env:
          FETCH_CONCURRENCY: "6"
        run: |
          target/release/bevy-manual-mcp fetch-docs "$VERSION" \
            --out "$RUNNER_TEMP/bevy-docs"

      - name: Fetch Bevy engine examples
        run: |
          git clone --depth 1 --branch "v${VERSION}" --filter=blob:none --sparse \
            https://github.com/bevyengine/bevy.git "$RUNNER_TEMP/bevy-src"
          git -C "$RUNNER_TEMP/bevy-src" sparse-checkout set examples

      - name: Harvest metadata
        env:
          BEVY_META_DIR: ${{ runner.temp }}/bevy-meta
        run: |
          target/release/bevy-manual-mcp harvest-meta "$VERSION" \
            --out "$BEVY_META_DIR/$VERSION" --force
          target/release/bevy-manual-mcp harvest-compat \
            --out "$RUNNER_TEMP/ecosystem"
          target/release/bevy-manual-mcp fetch-website \
            --out "$RUNNER_TEMP/bevy-website"

      - name: Resolve the minor release tag
        run: |
          MINOR="${VERSION%.*}"
          echo "RELEASE_TAG=v$MINOR" >> "$GITHUB_ENV"

      - name: Build the index bundle
        env:
          BEVY_MCP_DATA_DIR: ${{ runner.temp }}/data
          BEVY_META_DIR: ${{ runner.temp }}/bevy-meta
          BEVY_WEBSITE_DIR: ${{ runner.temp }}/bevy-website
          BEVY_EXAMPLES_DIR: ${{ runner.temp }}/bevy-src/examples
        run: |
          mkdir -p dist
          target/release/bevy-manual-mcp build \
            --doc-dir "$RUNNER_TEMP/bevy-docs" \
            --out "$BEVY_MCP_DATA_DIR/versions/$VERSION" \
            --pack "dist/bevy-$VERSION-fmt1.tar.zst" \
            --manifest dist/index-manifest.json \
            --revision "$REVISION"

      - name: Attach the bundle to the Bevy release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Bevy ${{ env.RELEASE_TAG }} index"
          overwrite_files: true
          body: |
            Prebuilt Bevy ${{ env.VERSION }} index for `bevy-manual-mcp`.
            The release is minor-scoped; patch versions resolve to this corpus.

            Install it with:
            ```
            bevy-manual-mcp fetch-index ${{ env.VERSION }}
            ```
          files: |
            dist/bevy-${{ env.VERSION }}-fmt1.tar.zst
            dist/index-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  crate:
    if: ${{ inputs.publish_crate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --locked --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
