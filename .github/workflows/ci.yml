name: ci

on:
  push:
    branches: [main]
    # Prose and licence changes cannot break the tests. Skipping them keeps the
    # check meaningful and makes doc pushes instant. pull_request is left
    # unfiltered on purpose so a PR always reports a status.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      # The test suite builds its rustdoc fixture with a real `cargo doc`, so the
      # ingest tests run against genuine rustdoc markup rather than a hand-written
      # HTML string. Without this the suite fails at the fixture step.
      - uses: dtolnay/rust-toolchain@stable

      - run: npm test
      - run: npm run test:package -- --git

      - name: Check server manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('server.json','utf8')); console.log('server.json parses')"
