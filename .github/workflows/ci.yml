name: ci

on:
  push:
    branches: [main]
    # Prose and licence changes cannot break the tests. Skipping them keeps the
    # check meaningful and makes doc pushes instant. pull_request is left
    # unfiltered on purpose so a PR always reports a status.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate server.json against the MCP registry schema
        run: node -e "JSON.parse(require('fs').readFileSync('server.json','utf8')); console.log('server.json parses')"
