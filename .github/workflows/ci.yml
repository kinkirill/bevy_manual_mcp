name: ci

on:
  push:
    branches: [main]
    # Skip documentation-only pushes; PRs always run checks.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      # Ingestion tests generate their fixture with cargo doc.
      - uses: dtolnay/rust-toolchain@stable

      - run: npm test
      - run: npm run test:package -- --git

      - name: Check server manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('server.json','utf8')); console.log('server.json parses')"
