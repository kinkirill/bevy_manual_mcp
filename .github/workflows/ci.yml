name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate server.json against the MCP registry schema
        run: node -e "JSON.parse(require('fs').readFileSync('server.json','utf8')); console.log('server.json parses')"
