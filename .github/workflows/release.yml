name: release

# Publishing flow for a new Bevy minor (e.g. 0.20.0):
#   1. bump "version" and server.json to the Bevy minor
#   2. git tag v0.20.0 && git push origin v0.20.0
#   3. this job mirrors rustdoc, builds the index, attaches the prebuilt
#      bundle to the GitHub Release, and publishes to npm.
#
# The index bundle is what makes `npx bevy-mcp` fast for everyone else: without
# it, first run has to mirror docs (~15 min) and build (~15 min).
#
# Required repository secrets:
#   NPM_TOKEN   npm automation token with publish rights for `bevy-mcp`
# GITHUB_TOKEN is provided automatically.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Bevy version to build (e.g. 0.20.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      NODE_OPTIONS: --max-old-space-size=4096
      BEVY_MCP_OFFLINE: "1"
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Normalise version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Mirror rustdoc from docs.rs
        env:
          FETCH_CONCURRENCY: "6"
        run: node scripts/fetch-docs.mjs "$VERSION" --out "$RUNNER_TEMP/bevy-docs"

      - name: Fetch Bevy engine examples (sparse)
        run: |
          git clone --depth 1 --branch "v${VERSION}" --filter=blob:none --sparse \
            https://github.com/bevyengine/bevy.git "$RUNNER_TEMP/bevy-src"
          git -C "$RUNNER_TEMP/bevy-src" sparse-checkout set examples

      - name: Build the search index
        env:
          BEVY_VERSION: ${{ env.VERSION }}
          BEVY_DOC_DIR: ${{ runner.temp }}/bevy-docs
          BEVY_SRC_DIR: ${{ runner.temp }}/bevy-src
          BEVY_MCP_DATA_DIR: ${{ github.workspace }}/data
        run: node scripts/build-index.mjs "$VERSION" --force

      - name: Package the index bundle
        run: node scripts/publish-index.mjs "$VERSION" --data ./data --out ./dist

      - name: Attach bundle to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: dist/bevy-index-*.tar.gz
          name: "Bevy ${{ env.VERSION }} index"
          body: |
            Prebuilt Bevy ${{ env.VERSION }} search index for bevy-mcp.

            Install it with:
            ```
            npx bevy-mcp fetch-index ${{ env.VERSION }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public
