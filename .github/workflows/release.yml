name: release

# Publish prebuilt indexes for Bevy version tags; npm publication is opt-in.
# Configure npm trusted publishing as described in PUBLISHING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Bevy version to build (e.g. 0.20.0)"
        required: true

permissions:
  contents: write
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      NODE_OPTIONS: --max-old-space-size=4096
      BEVY_MCP_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      # Avoid dependency caches in release builds to reduce cache poisoning risk.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:package

      - name: Normalise version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Mirror rustdoc from docs.rs
        env:
          FETCH_CONCURRENCY: "6"
        run: node build/scripts/fetch-docs.mjs "$VERSION" --out "$RUNNER_TEMP/bevy-docs"

      - name: Fetch Bevy engine examples (sparse)
        run: |
          git clone --depth 1 --branch "v${VERSION}" --filter=blob:none --sparse \
            https://github.com/bevyengine/bevy.git "$RUNNER_TEMP/bevy-src"
          git -C "$RUNNER_TEMP/bevy-src" sparse-checkout set examples

      - name: Build the search index
        env:
          BEVY_VERSION: ${{ env.VERSION }}
          BEVY_DOC_DIR: ${{ runner.temp }}/bevy-docs
          BEVY_SRC_DIR: ${{ runner.temp }}/bevy-src
          BEVY_MCP_DATA_DIR: ${{ github.workspace }}/data
        run: node build/scripts/build-index.mjs "$VERSION" --force

      - name: Package the index bundle
        run: node build/scripts/publish-index.mjs "$VERSION" --data ./data --out ./dist

      - name: Attach bundle to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: dist/bevy-index-*.tar.gz
          name: "Bevy ${{ env.VERSION }} index"
          body: |
            Prebuilt Bevy ${{ env.VERSION }} search index for bevy-mcp.

            Install it with:
            ```
            npx --allow-git=all github:kinkirill/bevy_manual_mcp fetch-index ${{ env.VERSION }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # PUBLISH_NPM and an npm trusted publisher are required for this optional step.
      - name: Publish to npm (trusted publishing, opt-in)
        if: vars.PUBLISH_NPM == 'true'
        run: npm publish --access public --provenance
