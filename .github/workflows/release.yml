name: release

# Publishing flow for a new Bevy minor (e.g. 0.21.0):
#   1. bump "version" in package.json and server.json to the Bevy minor
#   2. git tag v0.21.0 && git push origin v0.21.0
#   3. this job mirrors rustdoc, builds the index, and attaches the prebuilt
#      bundle to the GitHub Release.
#
# Distribution is GitHub-first: users install with
#   npm install -g github:kinkirill/bevy_manual_mcp
# so the repository and its Release assets are the whole channel. There is no
# npm account in the critical path.
#
# npm publishing is available but opt-in (repository variable PUBLISH_NPM=true).
# It uses TRUSTED PUBLISHING (OIDC) rather than a token, because npm is retiring
# tokens that bypass 2FA. If you ever enable it, configure a Trusted Publisher
# on npmjs.com for this workflow - see PUBLISHING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Bevy version to build (e.g. 0.20.0)"
        required: true

permissions:
  contents: write
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      NODE_OPTIONS: --max-old-space-size=4096
      BEVY_MCP_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      # No dependency cache in release builds: a poisoned cache is a supply
      # chain risk, and this job runs rarely enough that it does not matter.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      - run: npm test

      - name: Normalise version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Mirror rustdoc from docs.rs
        env:
          FETCH_CONCURRENCY: "6"
        run: node scripts/fetch-docs.mjs "$VERSION" --out "$RUNNER_TEMP/bevy-docs"

      - name: Fetch Bevy engine examples (sparse)
        run: |
          git clone --depth 1 --branch "v${VERSION}" --filter=blob:none --sparse \
            https://github.com/bevyengine/bevy.git "$RUNNER_TEMP/bevy-src"
          git -C "$RUNNER_TEMP/bevy-src" sparse-checkout set examples

      - name: Build the search index
        env:
          BEVY_VERSION: ${{ env.VERSION }}
          BEVY_DOC_DIR: ${{ runner.temp }}/bevy-docs
          BEVY_SRC_DIR: ${{ runner.temp }}/bevy-src
          BEVY_MCP_DATA_DIR: ${{ github.workspace }}/data
        run: node scripts/build-index.mjs "$VERSION" --force

      - name: Package the index bundle
        run: node scripts/publish-index.mjs "$VERSION" --data ./data --out ./dist

      - name: Attach bundle to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: dist/bevy-index-*.tar.gz
          name: "Bevy ${{ env.VERSION }} index"
          body: |
            Prebuilt Bevy ${{ env.VERSION }} search index for bevy-mcp.

            Install it with:
            ```
            npx bevy-mcp fetch-index ${{ env.VERSION }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Optional: npm -------------------------------------------------
      # Off by default. Turn it on by creating a repository variable
      #   PUBLISH_NPM=true   (Settings -> Secrets and variables -> Actions)
      # and configuring a Trusted Publisher for this workflow on npmjs.com.
      # See PUBLISHING.md. Left disabled so tag pushes never fail on npm auth.
      - name: Publish to npm (trusted publishing, opt-in)
        if: vars.PUBLISH_NPM == 'true'
        run: npm publish --access public --provenance
